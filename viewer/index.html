<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jobs workspace</title>
  <script>
    (() => {
      const saved = localStorage.getItem('theme');
      const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <aside id="sidebar">
    <header class="sidebar-head">
      <div class="head-row">
        <span class="title">jobs workspace</span>
        <span class="head-right">
          <button id="theme-toggle" title="toggle dark mode">🌙</button>
          <span id="live" class="live" title="live updates">●&nbsp;live</span>
        </span>
      </div>
      <input id="search" class="search" type="search" placeholder="Filter files…" autocomplete="off" />
    </header>
    <div id="tree" class="tree"></div>
  </aside>
  <main id="main">
    <nav id="crumbs" class="crumbs"></nav>
    <article id="content" class="content">
      <p class="empty">Select a file from the tree.</p>
    </article>
  </main>
  <script src="/vendor/markdown-it.min.js"></script>
  <script src="/vendor/js-yaml.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
